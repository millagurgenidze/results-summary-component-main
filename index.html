<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
    <title>Frontend Mentor | Results summary component</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <main class="results-card">

        <section class="result-section">
            <h1>Your Result</h1>

            <div class="score-circle">
                <p class="score">76</p>
                <p class="score-total">of 100</p>
            </div>

            <h2>Great</h2>
            <p class="result-description">
                You scored higher than 65% of the people who have taken these tests.
            </p>
        </section>

        <section class="summary-section">
            <h2>Summary</h2>

            <div class="summary-list">
                <div class="summary-item reaction">
                    <div class="category">
                        <img src="./assets/images/icon-reaction.svg" alt="">
                        <p>Reaction</p>
                    </div>
                    <p class="category-score">80 <span>/ 100</span></p>
                </div>

                <div class="summary-item memory">
                    <div class="category">
                        <img src="./assets/images/icon-memory.svg" alt="">
                        <p>Memory</p>
                    </div>
                    <p class="category-score">92 <span>/ 100</span></p>
                </div>

                <div class="summary-item verbal">
                    <div class="category">
                        <img src="./assets/images/icon-verbal.svg" alt="">
                        <p>Verbal</p>
                    </div>
                    <p class="category-score">61 <span>/ 100</span></p>
                </div>

                <div class="summary-item visual">
                    <div class="category">
                        <img src="./assets/images/icon-visual.svg" alt="">
                        <p>Visual</p>
                    </div>
                    <p class="category-score">72 <span>/ 100</span></p>
                </div>
            </div>

            <a class="continue-button" href="#">Continue</a>
        </section>

    </main>

</body>
</html>
